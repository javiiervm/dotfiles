general {
    lock_cmd = quickshell -n -p ~/.config/quickshell/lock
    before_sleep_cmd = loginctl lock-session

    # Hyprland >= 0.55 uses Lua dispatchers.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Do not let systemd complete suspend until a Wayland session-lock client
    # (our Quickshell lockscreen) has actually acquired the session lock.
    inhibit_sleep = 3
}

